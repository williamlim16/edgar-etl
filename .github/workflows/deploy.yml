# Deploys the EDGAR_Dataset bundle to the prod target as the Databricks
# service principal (edgar_data) using OAuth M2M client credentials.
# NOTE: OIDC workload-identity federation is not available on Databricks
# Free Edition (no account-level APIs), so the SP's OAuth secret is stored
# as an encrypted GitHub secret instead.
#
# One-time setup (done):
#   - Databricks: OAuth secret generated for edgar_data in workspace
#     settings (Secrets tab).
#   - GitHub: repository secrets DATABRICKS_HOST, DATABRICKS_CLIENT_ID,
#     DATABRICKS_CLIENT_SECRET (the workflow accepts variables for HOST /
#     CLIENT_ID too), and a repository environment named "prod".
name: Deploy EDGAR bundle (prod)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environment "prod" (Settings > Environments) - kept so you can
    # later add required reviewers / protection rules before prod deploys.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod
        working-directory: .
        env:
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID || vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      - name: Deploy bundle
        run: databricks bundle deploy --target prod
        working-directory: .
        env:
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID || vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
