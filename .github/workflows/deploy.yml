# Deploys the EDGAR_Dataset bundle to the prod target as a Databricks
# service principal, using workload identity federation (GitHub OIDC).
# No Databricks secrets are stored in this repo: the runner gets a
# short-lived OIDC token from GitHub, and Databricks exchanges it for an
# OAuth token via the federation policy configured on the service
# principal.
#
# One-time setup:
#   1. Create a Databricks service principal and a GitHub OIDC federation
#      policy scoped to repo:williamlim16/edgar-etl, environment "prod".
#   2. Add the SP to the workspace and grant it access to edgar_prod.
#   3. In GitHub repo settings: create the "prod" environment, and add
#      repository variables DATABRICKS_HOST and DATABRICKS_CLIENT_ID.
name: Deploy EDGAR bundle (prod)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# id-token: write is required for GitHub to issue the OIDC token that
# Databricks exchanges for a short-lived OAuth token.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Uses the GitHub environment named "prod" (Settings > Environments).
    # The federation policy's subject claim matches this environment, so
    # only runs of this workflow in this environment can authenticate.
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Uncomment temporarily to print the OIDC subject claim if the
      # federation policy needs fixing:
      # - name: Debug OIDC subject
      #   run: |
      #     curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=databricks" | jq -r '.value' \
      #       | cut -d. -f2 | base64 -d | jq -r '.sub'

      - name: Validate bundle
        run: databricks bundle validate --target prod
        working-directory: .
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

      - name: Deploy bundle
        run: databricks bundle deploy --target prod
        working-directory: .
        env:
          DATABRICKS_AUTH_TYPE: github-oidc
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
