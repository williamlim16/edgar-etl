bundle:
  name: EDGAR_Dataset


include:
  - src/**/*.yml

permissions:
  - user_name: williaml1601@gmail.com
    level: CAN_MANAGE


# Destination catalog/schemas are DAB variables so each target (dev/prod)
# can point at its own catalog. Best practice: one catalog per environment
# (e.g. edgar_dev / edgar_prod) with identical schema names inside each,
# so the code never changes between environments.
variables:
  catalog:
    description: Unity Catalog catalog that holds all EDGAR data
    default: edgar
  stg_schema:
    default: stg
  fct_schema:
    default: fct
  dim_schema:
    default: dim
  mrt_schema:
    default: mrt
  # Pipelines run in development mode (allows full-refresh backfills)
  # in dev, production mode in the prod target.
  pipeline_mode:
    default: development


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-4be45d81-4fd9.cloud.databricks.com
    presets:
      tags:
        environment: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-4be45d81-4fd9.cloud.databricks.com
      root_path: /Workspace/Users/williaml1601@gmail.com/.bundle/${bundle.name}/${bundle.target}
    presets:
      tags:
        environment: prod
    variables:
      catalog: edgar_prod
      pipeline_mode: production